<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MÜHÜR • Bölümler</title><link rel="stylesheet" href="styles.css"></head><body><div class="phone"><main class="safe"><div class="topbar"><div><div class="eyebrow">MÜHÜR</div><b style="font-size:20px">Bölüm Yolu</b></div><div class="coinpill">◉ <span id="coins">480</span></div></div><section class="map-wrap"><div class="trail"></div><div id="nodes"></div></section><section class="card rewardbar"><div><div class="eyebrow">ÖNCEKİ TERİMLER SÖZLÜĞÜ</div><b>Çözülen kavramları tekrar et</b></div><button class="chip" onclick="location.href='collection.html'">İncele ›</button></section></main><nav class="nav"><a href="home.html"><span>⌂</span>Ana Sayfa</a><a class="active" href="map.html"><span>▦</span>Bölümler</a><a href="collection.html"><span>▤</span>Kavramlar</a><a href="profile.html"><span>●</span>Profil</a></nav></div><script src="app.js"></script><script>const s=MuhurUI.load();coins.textContent=s.coins;const box=nodes;for(let n=5;n>=1;n--){let row=document.createElement('div');row.className='map-row';let wrap=document.createElement('div');wrap.className='node-wrap';let done=s.completed.includes(n),cur=n===s.currentLevel,locked=n>s.currentLevel;wrap.innerHTML=`${cur?`<div class="current-card"><div class="eyebrow gold">✦ ŞU ANKİ BÖLÜM</div><b>Bölüm ${n}</b><small>${done?'Tamamlandı':'Yeni kavramlar seni bekliyor'}</small><button class="mini-btn">HEMEN BAŞLA →</button></div>`:''}<button class="node ${done?'completed':cur?'current':locked?'':'current'}" ${locked?'disabled':''}>${done?'✓':locked?'🔒':n}</button><div class="node-label">${n===5?'Hısımlık':n===4?'Fiil Ehliyeti':n===3?'Zilyetlik & Hak Ehliyeti':n===2?'Dürüstlük Kuralı':'Hak Kavramı'}</div><div class="node-sub">${done?'★★★':locked?'Kilitli':'Aktif bölüm'}</div>`;row.appendChild(wrap);box.appendChild(row);if(cur){wrap.querySelector('.mini-btn').onclick=()=>location.href=`game.html?level=${n}`;wrap.querySelector('.node').onclick=()=>location.href=`game.html?level=${n}`}}</script></body></html>
