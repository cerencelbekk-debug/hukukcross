<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MÜHÜR • Karakterini Seç</title><link rel="stylesheet" href="styles.css"></head><body><div class="phone"><main class="safe"><div class="topbar"><button class="back" onclick="history.back()">‹</button><b>Karakterini Seç</b><div class="round">♙</div></div><div class="steps"><span class="on"><b>1</b> Cinsiyet</span><span>→</span><span class="on"><b>2</b> Rol</span><span>→</span><span><b>3</b> Onay</span></div><div class="section-label"><span class="gold">1. CİNSİYET SEÇİMİ</span><span class="muted">Görünüm tarzını seç</span></div><div class="choice-grid"><button class="choice" data-g="female">♀ Kadın</button><button class="choice" data-g="male">♂ Erkek</button></div><div class="section-label"><span class="gold">2. HUKUKİ ROL</span><span class="muted">Oyun rolünü belirle</span></div><div class="roles"><button class="role" data-r="Avukat"><i>⚖</i>Avukat</button><button class="role" data-r="Hakim"><i>◆</i>Hakim</button><button class="role" data-r="Savcı"><i>▦</i>Savcı</button></div><section class="card preview"><div id="avatar" class="avatar">♀</div><div id="roleLabel" class="role-name">HAKİM</div><h2 id="name">Ceren</h2><div class="muted" style="font-size:12px">Seçtiğin rol profilindeki oyun kimliğini belirler.</div></section><button id="continueBtn" class="btn-primary" style="margin-top:16px">SEÇ VE DEVAM ET →</button><div class="muted" style="text-align:center;font-size:10px;margin-top:12px">Karakterini daha sonra Profil ekranından değiştirebilirsin.</div></main></div><script src="app.js"></script><script>let s=MuhurUI.load();const G=[...document.querySelectorAll('[data-g]')],R=[...document.querySelectorAll('[data-r]')];function draw(){G.forEach(b=>b.classList.toggle('selected',b.dataset.g===s.gender));R.forEach(b=>b.classList.toggle('selected',b.dataset.r===s.role));name.textContent=s.name||'Oyuncu';roleLabel.textContent=(s.role||'Hakim').toLocaleUpperCase('tr-TR');avatar.textContent=s.gender==='female'?'♀':'♂'}G.forEach(b=>b.onclick=()=>{s.gender=b.dataset.g;draw()});R.forEach(b=>b.onclick=()=>{s.role=b.dataset.r;draw()});continueBtn.onclick=()=>{MuhurUI.save(s);location.href='home.html'};draw();</script></body></html>
