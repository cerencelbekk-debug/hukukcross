<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MÜHÜR • Oyun</title><link rel="stylesheet" href="styles.css"></head><body><div class="phone"><main class="safe" style="padding-bottom:0"><div class="topbar"><button class="back" onclick="location.href='map.html'">‹</button><div class="game-head"><b id="fileTitle">Bölüm 3</b><div class="game-progress"><div class="game-progress-line"><i id="progLine"></i></div><span id="progText" class="muted" style="font-size:11px">0 / 6</span></div></div><div class="coinpill">◉ <span id="coins">480</span></div></div><section class="board"><div class="board-head"><span class="eyebrow">KELİME ALANI</span><span id="activeLabel" class="eyebrow gold">1. kelime aktif</span></div><div id="rows"></div></section><section class="card cluecard"><div class="clue-top"><div><span id="qno" class="eyebrow gold">1. SORU</span> <span id="len" class="eyebrow">• 6 HARF</span></div><div class="chips" style="padding:0"><button class="chip" id="prev">‹</button><button class="chip" id="next">›</button></div></div><h2 id="clue"></h2></section><section class="boosters"><button class="boost" id="hint">💡 İpucu<small>20 ◉</small></button><button class="boost" id="letter">◉ Harf Aç<small>50 ◉</small></button><button class="boost" id="word">✦ Kelime Aç<small>120 ◉</small></button></section><div class="keyboard" id="keyboard"></div></main></div><div class="toast" id="toast">Doğru!</div><script src="app.js"></script><script>
const level=Number(new URLSearchParams(location.search).get('level')||3),s=MuhurUI.load(),src=MuhurUI.DATA[level]||MuhurUI.DATA[2];let active=0,entries=src.map(([a])=>Array(MuhurUI.norm(a).length).fill('')),fixed=src.map(([a],i)=>i<2?[0,Math.max(0,MuhurUI.norm(a).length-1)]:i<4?[Math.floor(MuhurUI.norm(a).length/2)]:[]),solved=src.map(()=>false);fixed.forEach((idxs,i)=>idxs.forEach(j=>entries[i][j]=MuhurUI.norm(src[i][0])[j]));coins.textContent=s.coins;fileTitle.textContent='Bölüm '+level;
function render(){rows.innerHTML='';src.forEach(([ans],i)=>{let row=document.createElement('div');row.className='wordrow '+(i===active?'active ':'')+(solved[i]?'solved':'');row.innerHTML=`<div class="rnum">${i+1}</div><div class="tiles">${entries[i].map((c,j)=>`<div class="tile ${fixed[i].includes(j)?'fixed':''} ${i===active&&j===cursor(i)?'activecell':''}">${c||''}</div>`).join('')}</div>`;row.onclick=()=>{if(!solved[i]){active=i;render()}};rows.appendChild(row)});let ans=MuhurUI.norm(src[active][0]);qno.textContent=(active+1)+'. SORU';len.textContent='• '+ans.length+' HARF';clue.textContent=src[active][1];activeLabel.textContent=(active+1)+'. kelime aktif';let count=solved.filter(Boolean).length;progText.textContent=count+' / '+src.length;progLine.style.width=(count/src.length*100)+'%'}
function cursor(i){let j=entries[i].findIndex((c,k)=>!c&&!fixed[i].includes(k));return j<0?entries[i].length-1:j}
function type(ch){if(solved[active])return;let j=cursor(active);while(j<entries[active].length&&fixed[active].includes(j))j++;if(j<entries[active].length)entries[active][j]=ch;check();render()}
function back(){for(let j=entries[active].length-1;j>=0;j--){if(entries[active][j]&&!fixed[active].includes(j)){entries[active][j]='';break}}render()}
function check(){let ans=MuhurUI.norm(src[active][0]);if(entries[active].every(Boolean)){if(entries[active].join('')===ans){solved[active]=true;show('✓ DOĞRU');if(solved.every(Boolean)){s.completed=[...new Set([...s.completed,level])];s.currentLevel=Math.max(s.currentLevel,level+1);s.xp+=120;s.coins+=20;MuhurUI.save(s);setTimeout(()=>location.href='map.html',700);return}active=solved.findIndex((x,i)=>!x&&i>active);if(active<0)active=solved.findIndex(x=>!x)}else{show('Tekrar dene');navigator.vibrate?.(45)}}}
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),850)}
keyboard.innerHTML=`<div class="krow">${[...'QWERTYUIOPĞÜ'].map(x=>`<button class="key">${x}</button>`).join('')}</div><div class="krow">${[...'ASDFGHJKLŞİ'].map(x=>`<button class="key">${x}</button>`).join('')}</div><div class="krow"><button class="key wide" id="bk">⌫</button>${[...'ZXCVBNMÖÇ'].map(x=>`<button class="key">${x}</button>`).join('')}<button class="key wide" id="ok">✓</button></div>`;keyboard.querySelectorAll('.key').forEach(k=>{if(!['bk','ok'].includes(k.id))k.onclick=()=>type(k.textContent)});bk.onclick=back;ok.onclick=check;prev.onclick=()=>{let i=active;do{i=(i-1+src.length)%src.length}while(solved[i]&&i!==active);active=i;render()};next.onclick=()=>{let i=active;do{i=(i+1)%src.length}while(solved[i]&&i!==active);active=i;render()};hint.onclick=()=>show('İpucu: '+src[active][1]);letter.onclick=()=>{if(s.coins<50)return show('Yetersiz Mühür');let ans=MuhurUI.norm(src[active][0]),j=cursor(active);if(j>=0){entries[active][j]=ans[j];s.coins-=50;coins.textContent=s.coins;MuhurUI.save(s);render()}};word.onclick=()=>{if(s.coins<120)return show('Yetersiz Mühür');entries[active]=[...MuhurUI.norm(src[active][0])];s.coins-=120;coins.textContent=s.coins;MuhurUI.save(s);check();render()};render();
</script></body></html>
